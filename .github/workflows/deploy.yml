name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Extract production website
        run: |
          mkdir -p _site
          if [ -f site.zip.part-001 ]; then
            cat site.zip.part-* > "$RUNNER_TEMP/site.zip"
            (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/site.zip.sha256")
            unzip -q "$RUNNER_TEMP/site.zip" -d _site
          else
            unzip -q site.zip -d _site
          fi
          test -f _site/index.html
      - name: Apply checksum-verified runtime update
        run: |
          sha256sum -c runtime-update.zip.sha256
          unzip -q -o runtime-update.zip -d _site
          test -f _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
